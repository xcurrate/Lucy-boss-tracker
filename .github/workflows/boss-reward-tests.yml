name: Boss Reward Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/boss-reward-notifications]

jobs:
  parser-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run parser and unit tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
