name: Boss Reward Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: boss-reward-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parser-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and sync lockfile
        run: |
          npm install --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync lockfile for reward OCR dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run parser and unit tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
